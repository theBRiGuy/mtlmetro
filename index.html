<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>mtlmetro — a rating map of the Montréal Métro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* mtlmetro — styles */

:root{
  --ink:#0A0E11;
  --ground:#11171B;
  --surface:#182027;
  --surface-2:#202B33;
  --rule:#2C3A44;
  --rule-soft:#212C34;
  --text:#E9EEF1;
  --dim:#8FA1AC;
  --dimmer:#63737D;
  --tile:#F0E9DB;
  --gold:#E7C25A;

  --green:#16B25A;
  --orange:#F5871F;
  --yellow:#F0C41C;
  --blue:#3592E8;

  --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body:'Inter Tight', system-ui, -apple-system, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --panel-w:352px;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{
  /* pan-x pan-y permits scrolling but withholds pinch-zoom and double-tap zoom.
     'manipulation' would kill double-tap only and leave pinch alive. */
  touch-action:pan-x pan-y;
  -webkit-text-size-adjust:100%;
}
body{
  background:var(--ground);
  color:var(--text);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  touch-action:pan-x pan-y;
  overscroll-behavior:none;          /* no rubber-band, no pull-to-refresh */
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--tile);outline-offset:2px;border-radius:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:auto auto 1fr;height:100dvh;min-height:0}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:center;gap:18px;
  padding:12px 18px;
  border-bottom:1px solid var(--rule);
  background:var(--ink);
  flex-wrap:wrap;
}
.mark{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.mark svg{width:26px;height:26px;color:var(--tile)}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark b{
  font-family:var(--display);
  font-weight:800;font-stretch:118%;
  font-size:17px;letter-spacing:.10em;text-transform:uppercase;
}
.wordmark span{
  font-family:var(--mono);
  font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dimmer);margin-top:4px;
}

.tally{display:flex;align-items:baseline;gap:9px;margin-left:auto;flex:0 0 auto}
.tally .n{font-family:var(--display);font-weight:800;font-stretch:118%;font-size:22px;color:var(--tile)}
.tally .of{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer)}
.tally .of em{font-style:normal}

/* Label and its chips must wrap as one unit — as separate flex children the
   label gets stranded at the end of the previous row. */
/* Toggle: map colouring. A switch reads as on/off, which is what this is —
   unlike a segmented control, which implies two peer alternatives. */
.switch{display:flex;align-items:center;gap:9px;padding:4px 2px}
.switch .track{
  position:relative;width:34px;height:19px;border-radius:99px;flex:0 0 auto;
  background:var(--rule);border:1px solid var(--rule);transition:background .16s ease;
}
.switch .knob{
  position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;
  background:var(--dim);transition:transform .16s ease, background .16s ease;
}
.switch[aria-checked="true"] .track{background:color-mix(in srgb, var(--gold) 38%, transparent);border-color:var(--gold)}
.switch[aria-checked="true"] .knob{transform:translateX(15px);background:var(--gold)}
.switch-label{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;
}
.switch[aria-checked="true"] .switch-label{color:var(--text)}
@media (prefers-reduced-motion:reduce){
  .switch .track,.switch .knob{transition:none}
}

/* Each control belongs to exactly one view; showing both is noise. */
body[data-view="list"] #modeToggle{display:none}
body[data-view="map"]  #sortSeg{display:none}

.chipGroup{display:flex;align-items:center;gap:8px}
.railLabel{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dimmer);white-space:nowrap;
}
.reset{
  font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text);border:1px solid var(--dim);border-radius:3px;padding:4px 10px;
}
.reset:hover{background:var(--surface-2)}
.reset[hidden]{display:none}

.dist{display:flex;width:100%;height:14px;gap:2px;order:9;margin-top:2px}
.dist b{
  display:grid;place-items:center;height:100%;border-radius:1px;min-width:3px;
  font-family:var(--mono);font-size:9px;font-weight:500;color:rgba(0,0,0,.62);
  overflow:hidden;
}

.tchips{display:flex;gap:4px}
.tchip{
  width:27px;height:27px;border:1px solid var(--rule);border-radius:3px;
  font-family:var(--mono);font-size:11.5px;color:var(--dimmer);
}
.tchip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:rgba(0,0,0,.72);font-weight:500}

/* ---------- control rail ---------- */
.rail{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 18px;border-bottom:1px solid var(--rule);
  background:var(--ink);
}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{
  padding:5px 11px;font-size:11px;font-family:var(--mono);
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
.seg button + button{border-left:1px solid var(--rule)}

.lchips{display:flex;gap:6px}
.lchip{
  display:flex;align-items:center;gap:6px;
  padding:4px 10px 4px 7px;border:1px solid var(--rule);border-radius:99px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
.lchip i{width:9px;height:9px;border-radius:50%;background:currentColor;display:block}
.lchip[aria-pressed="true"]{color:var(--text);border-color:currentColor}
.lchip[aria-pressed="true"] i{box-shadow:0 0 0 3px color-mix(in srgb, currentColor 22%, transparent)}
.lchip.g{--c:var(--green)} .lchip.o{--c:var(--orange)}
.lchip.y{--c:var(--yellow)} .lchip.b{--c:var(--blue)}
.lchip i{background:var(--c)}
.lchip[aria-pressed="true"]{color:var(--c)}
.lchip[aria-pressed="true"] span{color:var(--text)}

.search{
  display:flex;align-items:center;gap:7px;
  border:1px solid var(--rule);border-radius:3px;padding:0 9px;background:var(--ground);
}
.search input{
  background:none;border:none;color:var(--text);font:inherit;font-size:13px;
  padding:6px 0;width:150px;
}
.search input::placeholder{color:var(--dimmer)}
.search input:focus{outline:none}
.search svg{width:13px;height:13px;color:var(--dimmer);flex:0 0 auto}

/* ---------- body ---------- */
.stage{position:relative;display:grid;grid-template-columns:1fr var(--panel-w);min-height:0;overflow:hidden}
.mapwrap{position:relative;overflow:hidden;background:var(--ground);min-height:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}

.zoom{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--ink)}
.zoom button{width:32px;height:30px;color:var(--dim);font-family:var(--mono);font-size:13px}
.zoom button + button{border-top:1px solid var(--rule)}
.zoom button:hover{background:var(--surface-2);color:var(--text)}

.hint{
  position:absolute;right:14px;bottom:14px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dimmer);pointer-events:none;
}

/* ---------- station glyphs ---------- */
.st{cursor:pointer}
.st .halo{fill:transparent}
.st:focus{outline:none}
.st:focus-visible .halo{fill:color-mix(in srgb, var(--tile) 18%, transparent)}
.st .dot{transition:r .18s ease, fill .18s ease, stroke .18s ease}
@media (prefers-reduced-motion:reduce){.st .dot{transition:none}}
.st:hover .dot{stroke:var(--tile)}
.st.sel .dot{stroke:var(--tile);stroke-width:3}
.stlabel{
  font-family:var(--body);font-size:11.5px;font-weight:500;
  fill:var(--dim);pointer-events:none;
  paint-order:stroke;stroke:var(--ground);stroke-width:3.5px;stroke-linejoin:round;
}
.st.ix .stlabel{fill:var(--text);font-weight:600;font-size:12px}
.st:hover .stlabel,.st.sel .stlabel{fill:var(--tile)}
.st.dim{opacity:.16}
.st.dim .stlabel{opacity:0}
.line-path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:7}
.line-path.muted{opacity:.46}
.line-path.dim{opacity:.13}
.tilegrid{opacity:.028}

/* ---------- panel ---------- */
.panel{
  border-left:1px solid var(--rule);background:var(--ink);
  display:flex;flex-direction:column;min-height:0;
}
.panel-scroll{overflow-y:auto;padding:20px;flex:1;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.p-empty{color:var(--dimmer);font-size:13.5px;padding:4px 0}
.p-empty b{display:block;font-family:var(--display);font-weight:700;font-stretch:112%;
  text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--dim);margin-bottom:10px}

.p-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dimmer)}
.p-name{
  font-family:var(--display);font-weight:800;font-stretch:112%;
  font-size:27px;line-height:1.08;letter-spacing:-.005em;margin:8px 0 14px;
}
.facts{border-top:1px solid var(--rule-soft);margin-bottom:20px}
.fact{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.fact dt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);flex:0 0 auto;padding-top:2px}
.fact dd{margin:0;text-align:right;font-size:13.5px;color:var(--text)}

.nav{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.nav-line{border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.nav-line.active{border-color:color-mix(in srgb, var(--c) 52%, transparent)}
.nav-head{
  display:flex;align-items:center;gap:8px;padding:7px 11px;
  background:color-mix(in srgb, var(--c) 12%, transparent);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);
}
.nav-head b{
  width:15px;height:15px;border-radius:50%;background:var(--c);color:var(--ink);
  display:grid;place-items:center;font-size:9.5px;font-weight:600;flex:0 0 auto;
}
.nav-row{display:grid;grid-template-columns:1fr 1fr}
.nav-btn{
  display:flex;align-items:center;gap:8px;padding:11px;min-width:0;
  font-size:13px;color:var(--text);text-align:left;
}
.nav-btn + .nav-btn{border-left:1px solid var(--rule);justify-content:flex-end;text-align:right}
.nav-btn:hover:not(:disabled){background:color-mix(in srgb, var(--c) 14%, transparent)}
.nav-btn:disabled{color:var(--dimmer);cursor:default}
.nav-btn .ar{color:var(--c);flex:0 0 auto;font-size:16px;line-height:1}
.nav-btn:disabled .ar{color:var(--rule)}
.nav-btn .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-term{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  white-space:nowrap;
}

.p-h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);margin-bottom:9px}

.score{
  border:1px solid color-mix(in srgb, var(--c) 34%, transparent);
  background:color-mix(in srgb, var(--c) 8%, transparent);
  border-radius:4px;padding:15px 16px 13px;margin-bottom:18px;
}
.score .pips{display:flex;gap:4px;margin-bottom:11px}
.score .pip{width:26px;height:26px;color:color-mix(in srgb, var(--c) 22%, transparent)}
.score .pip[data-on="1"]{color:var(--c)}
.score .pip svg{width:100%;height:100%;display:block}
.score-name{
  font-family:var(--display);font-weight:700;font-stretch:112%;
  font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--c);margin-bottom:6px;
}
.score-gloss{font-size:13.5px;color:var(--text);line-height:1.45}
.score-by{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dimmer);margin-top:10px;
}

textarea{
  width:100%;min-height:88px;resize:vertical;background:var(--ground);
  border:1px solid var(--rule);border-radius:3px;color:var(--text);
  font:inherit;font-size:13.5px;padding:10px;
}
textarea:focus{outline:none;border-color:var(--dim)}
textarea::placeholder{color:var(--dimmer)}

.readlink{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:20px;padding:12px 14px;border:1px solid var(--rule);border-radius:3px;
  text-decoration:none;color:var(--text);background:var(--surface);
}
.readlink:hover{border-color:var(--tile)}
.readlink small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dimmer);margin-bottom:3px}
.readlink strong{font-weight:500;font-size:13px}
.readlink svg{width:14px;height:14px;flex:0 0 auto;color:var(--dim)}

.panel-foot{
  border-top:1px solid var(--rule);padding:11px 18px;display:flex;gap:8px;align-items:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
}
.panel-foot button{color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.panel-foot button:hover{color:var(--text)}
.panel-foot .sp{flex:1}

.credit{
  padding:10px 18px 13px;border-top:1px solid var(--rule-soft);
  font-size:11px;line-height:1.45;color:var(--dimmer);background:var(--ink);
}
.credit a{color:var(--dim)}

/* ---------- list view ---------- */
.listview{display:none;overflow-y:auto;padding:6px 0 20px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
body[data-view="list"] .listview{display:block}
body[data-view="list"] .mapwrap{display:none}
.lgroup{padding:16px 18px 4px}
.lgroup h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--c);margin:0 0 6px;font-weight:500}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 18px;border-bottom:1px solid var(--rule-soft)}
.lrow:hover{background:var(--surface)}
.lrow .bul{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.lrow .nm{flex:1;font-size:14px}
.lrow .sc{font-family:var(--mono);font-size:11.5px;min-width:26px;text-align:right;font-weight:500}

/* ---------- collapsible filter drawer ---------- */
.filtersToggle{display:none}
.rail-more{display:contents}          /* desktop: children lay out in the rail directly */

/* ---------- mobile bottom sheet ---------- */
.sheetHead{display:none}

/* ---------- responsive ---------- */
@media (max-width:900px){
  /* tighter masthead */
  .masthead{padding:calc(9px + env(safe-area-inset-top)) 14px 9px;gap:10px}
  .wordmark b{font-size:15px}
  .wordmark span{font-size:8.5px;margin-top:3px}
  .mark svg{width:22px;height:22px}
  .tally .n{font-size:17px}
  .tally .of{font-size:9px}
  .dist{height:11px}
  .dist b{font-size:8.5px}

  /* rail collapses to two controls; the rest lives in a drawer */
  .rail{padding:7px 14px;gap:8px}
  .filtersToggle{
    display:flex;align-items:center;gap:6px;
    padding:5px 11px;border:1px solid var(--rule);border-radius:3px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  }
  .filtersToggle .chev{font-size:9px;transition:transform .18s ease}
  body[data-filters="open"] .filtersToggle{background:var(--surface-2);color:var(--text)}
  body[data-filters="open"] .filtersToggle .chev{transform:rotate(180deg)}
  .rail-more{
    display:none;width:100%;flex-wrap:wrap;align-items:center;gap:8px;
    padding-top:8px;border-top:1px solid var(--rule-soft);
  }
  body[data-filters="open"] .rail-more{display:flex}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  /* Narrow screens: label always sits above its own row of chips, so the two
     groups read consistently instead of one wrapping and one not. */
  .chipGroup{flex-direction:column;align-items:flex-start;gap:6px;width:100%}
  .lchips,.tchips{flex-wrap:wrap}

  /* map fills the stage; the panel floats over it */
  .stage{display:block;position:relative;grid-template-columns:none}
  .mapwrap{position:absolute;inset:0}
  .listview{position:absolute;inset:0;overflow-y:auto;padding-bottom:120px}
  .hint{display:none}
  .stlabel{font-size:15px}
  .st.ix .stlabel{font-size:16px}

  .panel{
    position:absolute;left:0;right:0;bottom:0;z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
    /* 82% of the STAGE, not the viewport. Against dvh the sheet outgrows its
       container when the filter drawer opens, and .stage's overflow:hidden
       clips the grab handle off the top. */
    max-height:82%;border-left:none;border-top:1px solid var(--rule);
    border-radius:14px 14px 0 0;box-shadow:0 -14px 36px rgba(0,0,0,.55);
    transform:translateY(100%);
    transition:transform .22s cubic-bezier(.32,.72,0,1);
  }
  body[data-sheet="peek"] .panel{transform:translateY(calc(100% - 78px))}
  body[data-sheet="open"] .panel{transform:translateY(0)}

  .sheetHead{
    display:flex;flex-direction:column;align-items:stretch;gap:9px;
    padding:9px 18px 12px;width:100%;flex:0 0 auto;
    border-bottom:1px solid var(--rule-soft);
  }
  .grab{width:34px;height:4px;border-radius:99px;background:var(--rule);margin:0 auto;flex:0 0 auto}
  .sh-row{display:flex;align-items:center;gap:10px;min-width:0}
  .sh-name{
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--display);font-weight:700;font-stretch:112%;font-size:16px;text-align:left;
  }
  .sh-score{
    flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:500;
    padding:2px 8px;border-radius:99px;color:rgba(0,0,0,.75);background:var(--c,var(--rule));
  }
  .panel-scroll{padding:18px}
}

@media (max-width:560px){
  .masthead{padding:8px 12px}
  .rail{padding:7px 12px}
  .panel-scroll{padding:16px}
  .nav-row{grid-template-columns:1fr 1fr}
  .nav-btn{padding:12px 10px;font-size:12.5px}
}

@media (prefers-reduced-motion:reduce){
  .panel{transition:none}
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">


<div class="app">
  <header class="masthead">
    <div class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10.2" fill="none" stroke="currentColor" stroke-width="1.9"/>
        <path d="M12 4.9v7.4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M6.9 11.6 12 18.6l5.1-7z" fill="currentColor"/>
      </svg>
      <div class="wordmark">
        <b>mtlmetro</b>
        <span>68 stations · 4 lignes</span>
      </div>
    </div>

    <div class="tally">
      <span class="n" id="tallyN">3.26</span>
      <span class="of">avg <em id="tallyCount">across all 68 stations</em></span>
    </div>

    <div class="dist" id="dist" aria-hidden="true"></div>
  </header>

  <div class="rail">
    <div class="seg" role="group" aria-label="View">
      <button id="viewMap" aria-pressed="true">Map</button>
      <button id="viewList" aria-pressed="false">List</button>
    </div>

    <button class="filtersToggle" id="filtersToggle" aria-expanded="false" aria-controls="railMore">
      Filters <span class="chev">▾</span>
    </button>

    <div class="rail-more" id="railMore">
      <button class="switch" id="modeToggle" role="switch" aria-checked="true">
        <span class="track"><span class="knob"></span></span>
        <span class="switch-label">Show stations as ratings</span>
      </button>

      <div class="seg" id="sortSeg" role="group" aria-label="Order the list by">
        <button id="sortLine" aria-pressed="true">By line</button>
        <button id="sortScore" aria-pressed="false">By score</button>
      </div>

      <div class="chipGroup">
        <span class="railLabel" id="lchipsLabel">Show lines</span>
        <div class="lchips" id="lchips" role="group" aria-labelledby="lchipsLabel"></div>
      </div>

      <div class="chipGroup">
        <span class="railLabel" id="tchipsLabel">Show scores</span>
        <div class="tchips" id="tchips" role="group" aria-labelledby="tchipsLabel"></div>
      </div>

        dot.setAttribute("fill", TIERS[r].hex);
        dot.setAttribute("fill-opacity", 1);
        dot.setAttribute("stroke", "var(--ground)");
        dot.setAttribute("stroke-width", 1.6);
      } else {
        const ix = s.lines.length > 1;
        dot.setAttribute("r", ix ? 7 : 5);
        dot.setAttribute("fill", ix ? "var(--ground)" : LINES[s.lines[0]].hex);
        dot.setAttribute("fill-opacity", 1);
        dot.setAttribute("stroke", ix ? "var(--tile)" : "var(--ground)");
        dot.setAttribute("stroke-width", ix ? 2.6 : 1.6);
      }
      if (state.selected === s.id) {
        dot.setAttribute("stroke", "var(--tile)");
        dot.setAttribute("stroke-width", 3);
      }
    });
  }
  var drag = null;
  var pinch = null;
  map.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".st") || pinch) return;
    drag = { px: e.clientX, py: e.clientY, vx: view.x, vy: view.y };
    map.setPointerCapture(e.pointerId);
    map.classList.add("dragging");
  });
  map.addEventListener("pointermove", (e) => {
    if (!drag || pinch) return;
    const rect = map.getBoundingClientRect();
    const scale = view.w / rect.width;
    view.x = drag.vx - (e.clientX - drag.px) * scale;
    view.y = drag.vy - (e.clientY - drag.py) * scale;
    applyView();
  });
  var endDrag = () => {
    drag = null;
    map.classList.remove("dragging");
  };
  map.addEventListener("pointerup", endDrag);
  map.addEventListener("pointercancel", endDrag);
  var clampW = (w) => Math.min(BASE_VIEW.w * 2.2, Math.max(BASE_VIEW.w * 0.12, w));
  function zoomTo(newWidth, cx, cy) {
    const nw = clampW(newWidth);
    const k = nw / view.w;
    view.x = cx - (cx - view.x) * k;
    view.y = cy - (cy - view.y) * k;
    view.w = nw;
    applyView();
  }
  function zoomAt(factor, cx, cy) {
    zoomTo(view.w * factor, cx, cy);
  }
  function toUser(clientX, clientY) {
    const r = map.getBoundingClientRect();
    return {
      x: view.x + (clientX - r.left) / r.width * view.w,
      y: view.y + (clientY - r.top) / r.height * view.h
    };
  }
  map.addEventListener("wheel", (e) => {
    e.preventDefault();
    const u = toUser(e.clientX, e.clientY);
    zoomAt(e.deltaY > 0 ? 1.14 : 0.88, u.x, u.y);
  }, { passive: false });
  document.getElementById("zin").onclick = () => zoomAt(0.8, view.x + view.w / 2, view.y + view.h / 2);
  document.getElementById("zout").onclick = () => zoomAt(1.25, view.x + view.w / 2, view.y + view.h / 2);
  document.getElementById("zfit").onclick = fitAll;
  var midpoint = (e) => ({
    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
  });
  map.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      drag = null;
      map.classList.remove("dragging");
      pinch = { d: touchDist(e), w: view.w };
    }
  }, { passive: true });
  map.addEventListener("touchmove", (e) => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const m = midpoint(e);
    const u = toUser(m.x, m.y);
    zoomTo(pinch.w * (pinch.d / touchDist(e)), u.x, u.y);
  }, { passive: false });
  var endPinch = (e) => {
    if (!e.touches || e.touches.length < 2) pinch = null;
  };
  map.addEventListener("touchend", endPinch, { passive: true });
  map.addEventListener("touchcancel", endPinch, { passive: true });
  function touchDist(e) {
    const [a, b] = e.touches;
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
  ["gesturestart", "gesturechange", "gestureend"].forEach((type) => {
    document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  });
  document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
  function initialView() {
    if (isMobile()) {
      focusOn(
        580,
        BASE_VIEW.y + BASE_VIEW.h / 2,
        Math.min(BASE_VIEW.w, BASE_VIEW.h / aspect())
      );
    } else {
      fitAll();
    }
  }

  // js/panel.js
  var onSelect2 = () => {
  };
  function initPanel(handlers) {
    onSelect2 = handlers.onSelect;
    sheetHead.onclick = () => {
      const opening = document.body.dataset.sheet !== "open";
      if (opening) setFilterDrawer(false);
      setSheet(opening ? "open" : "peek");
    };
  }
  var panel = document.getElementById("panel");
  var PIP_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="12" cy="12" r="10.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
  <path d="M12 5.4v6.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M7.2 11.4 12 18l4.8-6.6z" fill="currentColor"/>
</svg>`;
  function navBtn(id, line, dir) {
    const arrow = dir === "prev" ? "\u2190" : "\u2192";
    if (!id) {
      const term = `<span class="nav-term">End of line</span>`;
      return `<button class="nav-btn ${dir}" disabled>${dir === "prev" ? `<span class="ar">${arrow}</span>${term}` : `${term}<span class="ar">${arrow}</span>`}</button>`;
    }
    const n = escapeHtml(BY_ID[id].name);
    const nm = `<span class="nm2">${n}</span>`;
    return `<button class="nav-btn ${dir}" data-go="${id}" data-line="${line}" title="${n}">${dir === "prev" ? `<span class="ar">${arrow}</span>${nm}` : `${nm}<span class="ar">${arrow}</span>`}</button>`;
  }
  function renderPanel() {
    if (!state.selected) {
      panel.innerHTML = `<div class="p-empty">
      <b>Nothing state.selected</b>
      Pick a station to see how Matt rated it, then ride the line with the arrows.
      At an interchange you get a set of arrows per line, so you can change trains.
    </div>`;
      return;
    }
    const s = BY_ID[state.selected];
    const r = RATINGS[s.id];
    const note = state.notes[s.id] || "";
    const nav = s.lines.map((l) => {
      const { prev, next } = neighbours(s.id, l);
      return `<div class="nav-line${l === state.navLine ? " state.active" : ""}" style="--c:${LINES[l].hex}">
      <div class="nav-head"><b>${LINES[l].num}</b> Ligne ${LINES[l].name}</div>
      <div class="nav-row">${navBtn(prev, l, "prev")}${navBtn(next, l, "next")}</div>
    </div>`;
    }).join("");
    panel.innerHTML = `
    <div class="p-eyebrow">${s.lines.length > 1 ? "Interchange \xB7 " : ""}${escapeHtml(s.borough)}</div>
    <h2 class="p-name">${escapeHtml(s.name)}</h2>

    <div class="score" style="--c:${TIERS[r].hex}">
      <div class="pips">
        ${[1, 2, 3, 4, 5].map((i) => `<span class="pip" data-on="${i <= r ? 1 : 0}">${PIP_SVG}</span>`).join("")}
      </div>
      <div class="score-name">${TIERS[r].name}</div>
      <div class="score-gloss">${TIERS[r].gloss}</div>
      <div class="score-by">Rated by Matt \xB7 metrodemontreal.com</div>
    </div>

    <div class="nav">${nav}</div>

    <dl class="facts">
      <div class="fact"><dt>Opened</dt><dd>${s.opened}</dd></div>
      <div class="fact"><dt>Lines</dt><dd>${s.lines.map((l) => LINES[l].en).join(" \xB7 ")}</dd></div>
    </dl>

    <a class="readlink" href="https://www.metrodemontreal.com/${s.path}/archmain.html" target="_blank" rel="noopener">
      <span>
        <small>metrodemontreal.com</small>
        <strong>Matt's write-up on this station</strong>
      </span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M7 17 17 7M9 7h8v8"/>
      </svg>
    </a>

    <div class="p-h" style="margin-top:24px">Your notes</div>
    <textarea id="note" placeholder="Been here? What did you make of it?">${escapeHtml(note)}</textarea>
  `;
    panel.querySelectorAll(".nav-btn[data-go]").forEach((b) => {
      b.onclick = () => onSelect2(b.dataset.go, b.dataset.line);
    });
    const ta = panel.querySelector("#note");
    ta.addEventListener("input", () => {
      const v = ta.value;
      if (v.trim()) state.notes[s.id] = v;
      else delete state.notes[s.id];
      saveNotes();
    });
    panel.scrollTop = 0;
  }
  var sheetHead = document.getElementById("sheetHead");
  var shName = document.getElementById("shName");
  var shScore = document.getElementById("shScore");
  function setSheet(stateName) {
    document.body.dataset.sheet = stateName;
    sheetHead.setAttribute("aria-expanded", String(stateName === "open"));
  }
  function renderSheetHead() {
    if (!state.selected) {
      shName.textContent = "Nothing state.selected";
      shScore.textContent = "";
      return;
    }
    const s = BY_ID[state.selected], r = RATINGS[s.id];
    shName.textContent = s.name;
    shScore.textContent = r + "/5";
    shScore.style.setProperty("--c", TIERS[r].hex);
  }
  map.addEventListener("click", (e) => {
    if (!e.target.closest(".st") && isMobile() && document.body.dataset.sheet === "open") {
      setSheet("peek");
    }
  });

  // js/list.js
  var onSelect3 = () => {
  };
  function initList(handlers) {
    onSelect3 = handlers.onSelect;
  }
  var listview = document.getElementById("listview");
  function renderList() {
    let html = "";
    if (state.sortBy === "score") {
      const rows = STATIONS.filter(visible).sort((a, b) => RATINGS[b.id] - RATINGS[a.id] || a.name.localeCompare(b.name, "fr"));
      for (const v of [5, 4, 3, 2, 1]) {
        const grp = rows.filter((s) => RATINGS[s.id] === v);
        if (!grp.length) continue;
        html += `<div class="lgroup" style="--c:${TIERS[v].hex}">
        <h3>${TIERS[v].name} \u2014 ${grp.length} station${grp.length === 1 ? "" : "s"}</h3></div>`;
        html += grp.map((s) => row(s, LINES[s.lines[0]].hex)).join("");
      }
    } else {
      for (const k in ORDER) {
        if (!state.active[k]) continue;
        const rows = ORDER[k].map((id) => BY_ID[id]).filter(visible);
        if (!rows.length) continue;
        html += `<div class="lgroup" style="--c:${LINES[k].hex}">
        <h3>Ligne ${LINES[k].num} \xB7 ${LINES[k].name} \u2014 ${escapeHtml(LINES[k].term)}</h3></div>`;
        html += rows.map((s) => row(s, LINES[k].hex)).join("");
      }
    }
    listview.innerHTML = html || `<div class="lgroup"><h3 style="--c:var(--dimmer)">No stations match</h3></div>`;
    listview.querySelectorAll(".lrow").forEach((b) => {
      b.onclick = () => onSelect3(b.dataset.id);
    });
  }
  function row(s, hex) {
    const r = RATINGS[s.id];
    return `<button class="lrow" data-id="${s.id}">
    <span class="bul" style="background:${hex}"></span>
    <span class="nm">${escapeHtml(s.name)}</span>
    <span class="sc" style="color:${TIERS[r].hex}">${r}/5</span>
  </button>`;
  }

  // js/tally.js
  function renderTally() {
    const shown = STATIONS.filter(visible);
    const avg = shown.length ? (shown.reduce((a, s) => a + RATINGS[s.id], 0) / shown.length).toFixed(2) : "\u2014";
    document.getElementById("tallyN").textContent = avg;
    document.getElementById("tallyCount").textContent = shown.length === 68 ? "across all 68 stations" : `across ${shown.length} shown`;
    const dist = document.getElementById("dist");
    dist.innerHTML = [5, 4, 3, 2, 1].map((v) => {
      const n = shown.filter((s) => RATINGS[s.id] === v).length;
      const pct = shown.length ? n / shown.length * 100 : 0;
      return `<b style="flex:${n || 1e-4};background:${TIERS[v].hex}"
              title="${TIERS[v].name}: ${n} station${n === 1 ? "" : "s"}"
              >${pct > 7 ? n : ""}</b>`;
    }).join("");
  }

  // js/controls.js
  var refresh = () => {
  };
  function initControls(handlers) {
    refresh = handlers.refresh;
    syncReset();
  }
  var chips = document.getElementById("lchips");
  chips.innerHTML = Object.keys(LINES).map((k) => `<button class="lchip ${k}" data-line="${k}" aria-pressed="true" title="${LINES[k].term}">
     <i></i><span>${LINES[k].name}</span>
   </button>`).join("");
  chips.addEventListener("click", (e) => {
    const b = e.target.closest(".lchip");
    if (!b) return;
    const k = b.dataset.line;
    state.active[k] = !state.active[k];
    b.setAttribute("aria-pressed", String(state.active[k]));
    refresh();
  });
  var tchips = document.getElementById("tchips");
  tchips.innerHTML = [5, 4, 3, 2, 1].map((v) => `<button class="tchip" data-tier="${v}" aria-pressed="true"
     style="--c:${TIERS[v].hex}" title="${TIERS[v].name} \u2014 ${TIERS[v].gloss}">${v}</button>`).join("");
  tchips.addEventListener("click", (e) => {
    const b = e.target.closest(".tchip");
    if (!b) return;
    const v = +b.dataset.tier;
    state.tiers[v] = !state.tiers[v];
    b.setAttribute("aria-pressed", String(state.tiers[v]));
    refresh();
  });
  var resetBtn = document.getElementById("reset");
  function syncReset() {
    const filtered = Object.values(state.active).some((v) => !v) || Object.values(state.tiers).some((v) => !v) || !!state.query;
    resetBtn.hidden = !filtered;
  }
  resetBtn.onclick = () => {
    for (const k in state.active) state.active[k] = true;
    for (const v in state.tiers) state.tiers[v] = true;
    state.query = "";
    document.getElementById("q").value = "";
    chips.querySelectorAll(".lchip").forEach((b) => b.setAttribute("aria-pressed", "true"));
    tchips.querySelectorAll(".tchip").forEach((b) => b.setAttribute("aria-pressed", "true"));
    refresh();
  };
  var modeToggle = document.getElementById("modeToggle");
  modeToggle.onclick = () => {
    const on = state.mode !== "ratings";
    state.mode = on ? "ratings" : "lines";
    modeToggle.setAttribute("aria-checked", String(on));
    paintMap();
  };
  var sL = document.getElementById("sortLine");
  var sS = document.getElementById("sortScore");
  sL.onclick = () => {
    state.sortBy = "line";
    sL.setAttribute("aria-pressed", "true");
    sS.setAttribute("aria-pressed", "false");
    renderList();
  };
  sS.onclick = () => {
    state.sortBy = "score";
    sS.setAttribute("aria-pressed", "true");
    sL.setAttribute("aria-pressed", "false");
    renderList();
  };
  var vM = document.getElementById("viewMap");
  var vL = document.getElementById("viewList");
  vM.onclick = () => {
    document.body.dataset.view = "map";
    vM.setAttribute("aria-pressed", "true");
    vL.setAttribute("aria-pressed", "false");
  };
  vL.onclick = () => {
    document.body.dataset.view = "list";
    vL.setAttribute("aria-pressed", "true");
    vM.setAttribute("aria-pressed", "false");
  };
  document.getElementById("q").addEventListener("input", (e) => {
    state.query = norm(e.target.value.trim());
    refresh();
  });
  document.getElementById("exportBtn").onclick = () => {
    const payload = STATIONS.map((s) => ({
      station: s.name,
      line: s.lines.map((l) => LINES[l].en).join("/"),
      mattsRating: RATINGS[s.id],
      myNote: state.notes[s.id] || "",
      source: `https://www.metrodemontreal.com/${s.path}/archmain.html`
    }));
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "mtlmetro-stations.json";
    a.click();
    URL.revokeObjectURL(a.href);
  };
  var filtersToggle = document.getElementById("filtersToggle");
  filtersToggle.onclick = () => {
    const open = document.body.dataset.filters !== "open";
    setFilterDrawer(open);
    if (open && document.body.dataset.sheet === "open") setSheet("peek");
    applyView();
  };

  // js/main.js
  function refresh2() {
    paintMap();
    renderTally();
    renderList();
    syncReset();
  }
  function select(id, line) {
    state.selected = id;
    const s = BY_ID[id];
    state.navLine = line && s.lines.includes(line) ? line : state.navLine && s.lines.includes(state.navLine) ? state.navLine : s.lines[0];
    paintMap();
    renderPanel();
    renderList();
    renderSheetHead();
    ensureVisible(s);
    if (isMobile() && document.body.dataset.sheet === "closed") setSheet("peek");
  }
  document.addEventListener("keydown", (e) => {
    if (!state.selected || e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const t = e.target.tagName;
    if (t === "TEXTAREA" || t === "INPUT") return;
    const { prev, next } = neighbours(state.selected, state.navLine);
    const go = e.key === "ArrowLeft" ? prev : next;
    if (go) {
      e.preventDefault();
      select(go, state.navLine);
    }
  });
  document.body.dataset.view = "map";
  document.body.dataset.filters = "closed";
  setSheet("closed");
  initMap({ onSelect: select });
  initPanel({ onSelect: select });
  initList({ onSelect: select });
  initControls({ refresh: refresh2 });
  (async () => {
    await loadNotes();
    buildMap();
    initialView();
    renderTally();
    renderPanel();
    renderList();
    syncReset();
  })();
})();
</script>
